<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert2 - Herramienta Multifuncional de Archivos</title>
    <meta name="description"
        content="Gestiona y convierte PDFs e imágenes de forma 100% local, privada y gratuita. Sin subir archivos a servidores.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Base Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Animated background blobs -->
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Horizontal Header Navigation for Desktop [NEW] -->
    <header class="header-nav">
        <div class="header-container">
            <div class="brand">
                <div class="logo-icon">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <div class="brand-text">
                    <h1>Convert2</h1>
                </div>
            </div>

            <nav class="nav-horizontal">
                <!-- Dropdown: Documentos PDF -->
                <div class="nav-dropdown">
                    <button class="dropdown-trigger">
                        <i class="fa-solid fa-file-pdf"></i> Documentos PDF <i class="fa-solid fa-chevron-down arrow-icon"></i>
                    </button>
                    <div class="dropdown-menu grid-3col">
                        <button class="nav-item active" data-tab="unir-pdf">
                            <i class="fa-solid fa-object-group"></i>
                            <span>Unir PDF</span>
                        </button>
                        <button class="nav-item" data-tab="separar-pdf">
                            <i class="fa-solid fa-scissors"></i>
                            <span>Separar PDF</span>
                        </button>
                        <button class="nav-item" data-tab="rotar-pdf">
                            <i class="fa-solid fa-rotate"></i>
                            <span>Rotar PDF</span>
                        </button>
                        <button class="nav-item" data-tab="imagenes-pdf">
                            <i class="fa-solid fa-images"></i>
                            <span>Imágenes a PDF</span>
                        </button>
                        <button class="nav-item" data-tab="pdf-imagenes">
                            <i class="fa-solid fa-file-image"></i>
                            <span>PDF a Imágenes</span>
                        </button>
                        <button class="nav-item" data-tab="firmar-pdf">
                            <i class="fa-solid fa-signature"></i>
                            <span>Firmar PDF</span>
                        </button>
                        <button class="nav-item" data-tab="proteger-pdf">
                            <i class="fa-solid fa-lock"></i>
                            <span>Proteger PDF</span>
                        </button>
                        <button class="nav-item" data-tab="docx-pdf">
                            <i class="fa-solid fa-file-pdf"></i>
                            <span>Word a PDF</span>
                        </button>
                        <button class="nav-item" data-tab="pdf-docx">
                            <i class="fa-solid fa-file-word"></i>
                            <span>PDF a Word</span>
                        </button>
                        <button class="nav-item" data-tab="organizar-pdf">
                            <i class="fa-solid fa-folder-tree"></i>
                            <span>Organizar PDF</span>
                        </button>
                        <button class="nav-item" data-tab="compresor-pdf">
                            <i class="fa-solid fa-compress"></i>
                            <span>Comprimir PDF</span>
                        </button>
                    </div>
                </div>

                <!-- Dropdown: Edición de Imágenes -->
                <div class="nav-dropdown">
                    <button class="dropdown-trigger">
                        <i class="fa-solid fa-image"></i> Edición de Imágenes <i class="fa-solid fa-chevron-down arrow-icon"></i>
                    </button>
                    <div class="dropdown-menu grid-2col">
                        <button class="nav-item" data-tab="convertir-img">
                            <i class="fa-solid fa-image"></i>
                            <span>Convertir Imagen</span>
                        </button>
                        <button class="nav-item" data-tab="compresor-img">
                            <i class="fa-solid fa-minimize"></i>
                            <span>Comprimir Imagen</span>
                        </button>
                        <button class="nav-item" data-tab="recortar-img">
                            <i class="fa-solid fa-crop-simple"></i>
                            <span>Recortar y Redim.</span>
                        </button>
                        <button class="nav-item" data-tab="marca-agua">
                            <i class="fa-solid fa-stamp"></i>
                            <span>Marca de Agua</span>
                        </button>
                        <button class="nav-item" data-tab="eliminar-fondo">
                            <i class="fa-solid fa-wand-magic-sparkles"></i>
                            <span>Eliminar Fondo</span>
                        </button>
                        <button class="nav-item" data-tab="limpiar-exif">
                            <i class="fa-solid fa-user-secret"></i>
                            <span>Limpiar EXIF</span>
                        </button>
                    </div>
                </div>

                <!-- Dropdown: Texto y Oficina -->
                <div class="nav-dropdown">
                    <button class="dropdown-trigger">
                        <i class="fa-solid fa-file-lines"></i> Texto y Oficina <i class="fa-solid fa-chevron-down arrow-icon"></i>
                    </button>
                    <div class="dropdown-menu">
                        <button class="nav-item" data-tab="extraer-texto">
                            <i class="fa-solid fa-file-lines"></i>
                            <span>Extraer Texto</span>
                        </button>
                        <button class="nav-item" data-tab="ocr-local">
                            <i class="fa-solid fa-eye"></i>
                            <span>OCR Local</span>
                        </button>
                        <button class="nav-item" data-tab="comparar-textos">
                            <i class="fa-solid fa-columns"></i>
                            <span>Comparar Textos</span>
                        </button>
                    </div>
                </div>

                <!-- Enlace Directo: Privacidad -->
                <button class="nav-item nav-link-item" data-tab="privacidad">
                    <i class="fa-solid fa-user-shield"></i>
                    <span>Privacidad</span>
                </button>
            </nav>

            <div class="header-badge">
                <span class="badge-status"><i class="fa-solid fa-shield-halved"></i> 100% Local</span>
            </div>
        </div>
    </header>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <div class="logo-icon">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <div class="brand-text">
                    <h1>Convert2</h1>
                </div>
            </div>

            <div class="nav-container">
                <div class="nav-section">
                    <span class="nav-section-title">Documentos PDF</span>
                    <nav class="nav-menu">
                        <button class="nav-item active" data-tab="unir-pdf" id="tab-unir-pdf">
                            <i class="fa-solid fa-object-group"></i>
                            <span>Unir PDF</span>
                        </button>
                        <button class="nav-item" data-tab="separar-pdf" id="tab-separar-pdf">
                            <i class="fa-solid fa-scissors"></i>
                            <span>Separar PDF</span>
                        </button>
                        <button class="nav-item" data-tab="rotar-pdf" id="tab-rotar-pdf">
                            <i class="fa-solid fa-rotate"></i>
                            <span>Rotar PDF</span>
                        </button>
                        <button class="nav-item" data-tab="imagenes-pdf" id="tab-imagenes-pdf">
                            <i class="fa-solid fa-images"></i>
                            <span>Imágenes a PDF</span>
                        </button>
                        <button class="nav-item" data-tab="pdf-imagenes" id="tab-pdf-imagenes">
                            <i class="fa-solid fa-file-image"></i>
                            <span>PDF a Imágenes</span>
                        </button>
                        <button class="nav-item" data-tab="firmar-pdf" id="tab-firmar-pdf">
                            <i class="fa-solid fa-signature"></i>
                            <span>Firmar PDF</span>
                        </button>
                        <button class="nav-item" data-tab="proteger-pdf" id="tab-proteger-pdf">
                            <i class="fa-solid fa-lock"></i>
                            <span>Proteger PDF</span>
                        </button>
                        <button class="nav-item" data-tab="docx-pdf" id="tab-docx-pdf">
                            <i class="fa-solid fa-file-pdf"></i>
                            <span>Word a PDF</span>
                        </button>
                        <button class="nav-item" data-tab="pdf-docx" id="tab-pdf-docx">
                            <i class="fa-solid fa-file-word"></i>
                            <span>PDF a Word</span>
                        </button>
                        <button class="nav-item" data-tab="organizar-pdf" id="tab-organizar-pdf">
                            <i class="fa-solid fa-folder-tree"></i>
                            <span>Organizar PDF</span>
                        </button>
                        <button class="nav-item" data-tab="compresor-pdf" id="tab-compresor-pdf">
                            <i class="fa-solid fa-compress"></i>
                            <span>Comprimir PDF</span>
                        </button>
                    </nav>
                </div>

                <div class="nav-section">
                    <span class="nav-section-title">Edición de Imágenes</span>
                    <nav class="nav-menu">
                        <button class="nav-item" data-tab="convertir-img" id="tab-convertir-img">
                            <i class="fa-solid fa-image"></i>
                            <span>Convertir Imagen</span>
                        </button>
                        <button class="nav-item" data-tab="compresor-img" id="tab-compresor-img">
                            <i class="fa-solid fa-minimize"></i>
                            <span>Comprimir Imagen</span>
                        </button>
                        <button class="nav-item" data-tab="recortar-img" id="tab-recortar-img">
                            <i class="fa-solid fa-crop-simple"></i>
                            <span>Recortar y Redim.</span>
                        </button>
                        <button class="nav-item" data-tab="marca-agua" id="tab-marca-agua">
                            <i class="fa-solid fa-stamp"></i>
                            <span>Marca de Agua</span>
                        </button>
                        <button class="nav-item" data-tab="eliminar-fondo" id="tab-eliminar-fondo">
                            <i class="fa-solid fa-wand-magic-sparkles"></i>
                            <span>Eliminar Fondo</span>
                        </button>
                        <button class="nav-item" data-tab="limpiar-exif" id="tab-limpiar-exif">
                            <i class="fa-solid fa-user-secret"></i>
                            <span>Limpiar EXIF</span>
                        </button>
                    </nav>
                </div>

                <div class="nav-section">
                    <span class="nav-section-title">Texto y Oficina</span>
                    <nav class="nav-menu">
                        <button class="nav-item" data-tab="extraer-texto" id="tab-extraer-texto">
                            <i class="fa-solid fa-file-lines"></i>
                            <span>Extraer Texto</span>
                        </button>
                        <button class="nav-item" data-tab="ocr-local" id="tab-ocr-local">
                            <i class="fa-solid fa-eye"></i>
                            <span>OCR Local</span>
                        </button>
                        <button class="nav-item" data-tab="comparar-textos" id="tab-comparar-textos">
                            <i class="fa-solid fa-columns"></i>
                            <span>Comparar Textos</span>
                        </button>
                    </nav>
                </div>

                <div class="nav-section">
                    <span class="nav-section-title">Información</span>
                    <nav class="nav-menu">
                        <button class="nav-item" data-tab="privacidad" id="tab-privacidad">
                            <i class="fa-solid fa-user-shield"></i>
                            <span>Privacidad Garantizada</span>
                        </button>
                    </nav>
                </div>
            </div>

            <div class="sidebar-footer">
                <p><i class="fa-solid fa-shield-halved"></i> 100% Privado & Local</p>
                <small>Tus archivos nunca salen del navegador</small>
            </div>
        </aside>

        <!-- Main content area -->
        
        <main class="main-content" id="main-content">
            <!-- Los paneles activos se inyectarán aquí dinámicamente -->
        </main>

    </div>

    <!-- Spinner Loader Overlay -->
    <div class="loader-overlay" id="loader-overlay" style="display: none;">
        <div class="loader-content">
            <div class="spinner"></div>
            <p id="loader-text">Procesando archivo...</p>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Application Logic (Loaded as ESM module to support module imports inside) -->
    <script type="module" src="app.js"></script>
</body>

</html>
